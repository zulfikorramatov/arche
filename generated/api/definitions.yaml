components:
  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, username, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        username:
          type: string
        created_at:
          type: string
          format: date-time

    UserList:
      type: array
      items:
        $ref: '#/components/schemas/User'

