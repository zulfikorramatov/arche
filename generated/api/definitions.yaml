openapi: 3.0.3
info:
  title: arche shared definitions
  version: 1.0.0
# This file holds only reusable components. It has no operations of its own;
# api.yaml references everything here via $ref. oapi-codegen turns these into
# definitions.go, and api.yaml reuses those Go types via import-mapping.
paths: {}
components:
  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid

    User:
      type: object
      required: [id, email, name, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        name:
          type: string
          minLength: 1

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
